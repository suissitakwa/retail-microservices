[project]
name = "recovery-agent"
version = "0.1.0"
description = "Investigates order/payment inconsistencies across the retail services and proposes one approved recovery action"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "aiokafka>=0.14.0",
    "langgraph>=1.2.16",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "respx>=0.23.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
